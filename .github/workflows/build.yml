name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'BKOS_NUI/**.ino'
      - 'BKOS_NUI/**.h'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 platform (core 2.x)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install "GFX Library for Arduino@1.3.7"
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "TAMC_GT911@1.0.2"
          arduino-cli lib install "ArduinoJson"

      - name: Install Lua 5.4 (embedded scripting voor apps)
        run: |
          curl -L https://www.lua.org/ftp/lua-5.4.7.tar.gz -o /tmp/lua.tgz
          tar xzf /tmp/lua.tgz -C /tmp
          mkdir -p ~/Arduino/libraries/LuaBKOS/src

          # Kopieer alleen veilige kern-bestanden (geen os/io/package/loadlib)
          for name in lapi lauxlib lbaselib lcode lctype ldebug ldo ldump \
                      lfunc lgc llex lmathlib lmem lobject lopcodes lparser \
                      lstate lstring lstrlib ltable ltablib ltm lundump \
                      lvm lzio lcorolib; do
            [ -f /tmp/lua-5.4.7/src/${name}.c ] && cp /tmp/lua-5.4.7/src/${name}.c ~/Arduino/libraries/LuaBKOS/src/
            [ -f /tmp/lua-5.4.7/src/${name}.h ] && cp /tmp/lua-5.4.7/src/${name}.h ~/Arduino/libraries/LuaBKOS/src/
          done
          cp /tmp/lua-5.4.7/src/lua.h   ~/Arduino/libraries/LuaBKOS/src/
          cp /tmp/lua-5.4.7/src/lualib.h ~/Arduino/libraries/LuaBKOS/src/
          cp /tmp/lua-5.4.7/src/lprefix.h ~/Arduino/libraries/LuaBKOS/src/ 2>/dev/null || true

          # Gebruik onze aangepaste luaconf (PSRAM, stack-limiet)
          cp $GITHUB_WORKSPACE/BKOS_NUI/lua_bkos_conf.h ~/Arduino/libraries/LuaBKOS/src/luaconf.h
          # Gebruik onze aangepaste linit (alleen veilige libs: base/math/string/table/coroutine)
          cp $GITHUB_WORKSPACE/BKOS_NUI/lua_linit_bkos.c ~/Arduino/libraries/LuaBKOS/src/linit.c

          # Library metadata
          cat > ~/Arduino/libraries/LuaBKOS/library.properties << 'PROPS'
          name=LuaBKOS
          version=5.4.7
          author=PUC-Rio (stripped for ESP32)
          maintainer=BKOS-NUI
          sentence=Lua 5.4 embedded interpreter voor BKOS apps
          paragraph=Zonder os/io/package bibliotheken; gebruikt PSRAM heap
          category=Other
          url=https://lua.org
          architectures=esp32
          PROPS

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=default,PartitionScheme=default_8MB,FlashSize=16M,FlashMode=dio,PSRAM=opi" \
            --output-dir build/ \
            BKOS_NUI/

      - name: Copy firmware.bin to sketch folder
        run: cp build/BKOS_NUI.ino.bin BKOS_NUI/firmware.bin

      - name: Commit firmware
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add BKOS_NUI/firmware.bin BKOS_NUI/versie.txt
          git diff --staged --quiet || git commit -m "ci: build firmware $(cat BKOS_NUI/versie.txt)"
          git push
